[tool.poetry]
name = "infomfss"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.2"
pillow = "^11.0.0"
psycopg2-binary = "^2.9.10"
python-dotenv = "^1.0.1"
djangorestframework = "^3.15.2"
generics = "^7.0.0"
coverage = "^7.6.4"
coreapi = "^2.3.3"
requests = "^2.32.3"
pyopenssl = "^24.2.1"
eventlet = "^0.37.0"
django-environ = "^0.11.2"
libsass = "^0.23.0"
django-compressor = "^4.5.1"
django-sass-processor = "^1.4.1"
django-crispy-forms = "^2.3"
crispy-bootstrap5 = "^2024.10"
django-smart-selects = "^1.7.2"
django-filter = "^24.3"
django-simple-captcha = "^0.6.1"
python-json-logger = "^3.2.1"
django-extensions = "^4.1"
pytest = "^8.3.5"
pytest-django = "^4.11.1"
factory-boy = "^3.3.3"
pytest-factoryboy = "^2.7.0"
pytest-cov = "^6.1.1"

[tool.poetry.group.lint.dependencies]
ruff = "^0.8.0"
basedpyright = "^1.23.0"

[tool.poetry.scripts]
gate = "scripts.gate:main"

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
 ".git",
 "migrations",
 "static_collected",
 "frontend",
 ".venv",
]

[tool.ruff.lint]
select = [
 "E", # pycodestyle ошибки
 "W", # pycodestyle предупреждения
 "F", # Pyflakes (неиспользуемые импорты, переменные и т.д.)
 "I", # isort (автоматическая сортировка импортов)
 "B", # flake8-bugbear (типичные баги Python)
 "DJ", # flake8-django (специфичные проверки Django)
]
ignore = [
 "DJ008", # не требовать __str__ у всех без исключения моделей, если не нужно
]

[tool.ruff.lint.isort]
known-first-party = ["config", "infoMFSS", "users"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["config", "infoMFSS", "users"]
exclude = ["**/migrations/**", "frontend/**", "static_collected/**"]
reportMissingTypeStubs = false

# --- Тестирование: Pytest ---

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings" # проверь, config или infoMFSS
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --no-migrations"

# --- Метрики качества: Coverage ---

[tool.coverage.run]
source = ["infoMFSS", "users"]
omit = [
 "*/migrations/*",
 "*/tests/*",
 "manage.py",
 "config/wsgi.py",
 "config/asgi.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

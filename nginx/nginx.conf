worker_processes 1;

events {
 worker_connections 1024;
}

http {
 include mime.types;
 default_type application/octet-stream;

 upstream django {
 server web:8000;
 }

 # Редирект HTTP -> HTTPS и поддержка ACME-челленджей
 server {
 listen 80;
 server_name info-mfss.ru;

 location /.well-known/acme-challenge/ {
 root /var/www/certbot;
 }

 location / {
 return 301 https://$host$request_uri;
 }
 }

 # HTTPS сервер
 server {
 listen 443 ssl;
 server_name info-mfss.ru;

 ssl_certificate /etc/letsencrypt/live/info-mfss.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/info-mfss.ru/privkey.pem;

 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;

 location /static/ {
 alias /app/static_collected/;
 }

 location /media/ {
 alias /app/media/;
 }

 location / {
 proxy_pass http://django;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header Host $host;
 proxy_redirect off;
 proxy_read_timeout 600s;
 proxy_connect_timeout 75s;
 proxy_send_timeout 600s;
 client_max_body_size 50M;
 proxy_buffering off;
 }
 }
}


[uwsgi]
chdir = /app
module = config.wsgi:application

master = true
processes = 4
threads = 2

http = :8000  # Используем HTTP вместо socket для работы с nginx proxy_pass

uid = info-mfss
gid = info-mfss

# Логи
logto = /app/uwsgi.log

# Не запускать от root
disable-logging = false
vacuum = true

static-map = /static=/app/static_collected

buffer-size = 32768
harakiri = 600
max-requests = 5000
http-timeout = 600
socket-timeout = 600
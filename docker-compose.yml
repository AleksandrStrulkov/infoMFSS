services:
  db:
    image: postgres:15-alpine  # Используем Alpine-образ для экономии места
    restart: unless-stopped    # Более гибкая политика перезапуска
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - '5433:5432'  # Используем порт 5433 для внешнего доступа (5432 занят локальным PostgreSQL)
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]  # Используем переменную из .env
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infoMFSS-networks

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app  # Монтируем весь проект для разработки
      - ./static_collected:/app/static_collected  # Bind mount для статики
      - ./media:/app/media  # Bind mount для медиа файлов
      - ./logs:/app/logs  # Bind mount для логов
    ports:
      - '8001:8000'  # Используем порт 8001 для внешнего доступа (8000 занят)
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_HOST=db  # Явно указываем имя сервиса
    networks:
      - infoMFSS-networks

  nginx: # Добавляем Nginx для production
    image: nginx:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./static_collected:/app/static_collected:ro  # Bind mount для статики
      - ./media:/app/media:ro  # Bind mount для медиа файлов
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - infoMFSS-networks

volumes:
  postgres_data:  # Только для базы данных

networks:
  infoMFSS-networks:
    driver: bridge